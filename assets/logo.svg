<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="chumthesizer">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
  </defs>

  <!-- rounded device badge -->
  <rect x="16" y="16" width="448" height="448" rx="104" fill="url(#badge)" stroke="#3a3a3a" stroke-width="3"/>

  <!-- multitouch finger dots across the top -->
  <circle cx="172" cy="128" r="10" fill="#cfcfcf"/>
  <circle cx="240" cy="118" r="10" fill="#f2f2f2"/>
  <circle cx="308" cy="128" r="10" fill="#cfcfcf"/>

  <!-- left eye = the Ulanzi dial (ring + indicator tick + hub) -->
  <circle cx="186" cy="222" r="40" fill="#141414" stroke="#f2f2f2" stroke-width="10"/>
  <line x1="186" y1="222" x2="186" y2="190" stroke="#f2f2f2" stroke-width="9" stroke-linecap="round"/>
  <circle cx="186" cy="222" r="7" fill="#f2f2f2"/>

  <!-- right eye = a pressed contact -->
  <circle cx="300" cy="222" r="18" fill="#f2f2f2"/>

  <!-- waveform 'smile' = the sound -->
  <path d="M150 312 q 23 -34 46 0 t 46 0 t 46 0 t 46 0" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-step sequencer strip, second step lit -->
  <rect x="176" y="360" width="22" height="22" rx="5" fill="none" stroke="#6e6e6e" stroke-width="3"/>
  <rect x="218" y="360" width="22" height="22" rx="5" fill="#f2f2f2"/>
  <rect x="260" y="360" width="22" height="22" rx="5" fill="none" stroke="#6e6e6e" stroke-width="3"/>
  <rect x="302" y="360" width="22" height="22" rx="5" fill="none" stroke="#6e6e6e" stroke-width="3"/>
</svg>
