<!doctype html>
<html><head><meta charset="utf-8"><title>OP-1 toy mock</title>
<style>
  :root{ --ink:#20201e; --muted:#7d7a73; --orange:#f0a23c; --blue:#2f6fb0; --red:#e8503a; --green:#46a06a; --panel:#e9e6df; }
  *{box-sizing:border-box; font-family:"Segoe UI",system-ui,sans-serif;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(1200px 700px at 60% -10%,#f6f4ef,#e4e1d9 70%); color:var(--ink); padding:22px 26px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px;}
  .name{font-weight:800;letter-spacing:.5px;font-size:20px;}
  .tag{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:2px;}
  .chips{display:flex;gap:8px;align-items:center;}
  .screen{background:#13231a;border:2px solid #cfe9d8;border-radius:10px;padding:7px 14px;color:#7CFFB2;font-family:ui-monospace,monospace;line-height:1.2;box-shadow:inset 0 0 12px rgba(0,255,140,.12);}
  .screen b{font-size:14px;} .screen small{color:#3fbf86;font-size:10px;letter-spacing:1px;}
  .chip{border:2px solid #cdc8bd;background:#f3f1ec;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;}
  .chip.on{border-color:var(--green);color:#2c7a4e;}
  .stage{display:flex;align-items:center;gap:26px;height:560px;}
  .dialwrap{width:300px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .dialwrap img{width:100%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.25));}
  .dlabel{font-size:10px;letter-spacing:2px;color:var(--muted);}
  .board{flex:1;height:100%;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(180deg,#34343a,#1b1b1f);border:3px solid #c7c3b8;box-shadow:0 18px 40px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
  .wave{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 30px;}
  .wave i{flex:1;background:linear-gradient(180deg,var(--orange),#f0d28c);border-radius:3px;opacity:.85;}
  .hint{position:relative;color:#d8d4cc;font-size:15px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .hint b{color:#fff;}
  .right{width:380px;display:flex;flex-direction:column;gap:14px;}
  .vibes{display:flex;flex-wrap:wrap;gap:8px;}
  .vibe{border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;color:#fff;}
  .secthead{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}
  .loops{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .loop{border-radius:14px;padding:14px;height:64px;background:#f3f1ec;border:2px solid #d8d3c8;display:flex;flex-direction:column;justify-content:center;}
  .loop b{font-size:18px;} .loop small{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .loop.rec{background:#fde8e4;border-color:var(--red);} .loop.rec small{color:var(--red);}
  .loop.play{background:#e7f1ea;border-color:var(--green);} .loop.play small{color:var(--green);}
  .beat{display:flex;gap:4px;} .beat i{flex:1;height:26px;border-radius:5px;background:#e2ddd2;border:1px solid #d2ccc0;}
  .beat i.on{background:var(--blue);border-color:var(--blue);} .beat i.b{background:#d6d0c4;}
</style></head>
<body>
  <div class="top">
    <div class="brand"><div class="logo">🦈</div><div><div class="name">CHUMTHESIZER</div></div><span class="tag">experimental sound toy</span></div>
    <div class="chips">
      <div class="screen"><b>PLUCK</b> &nbsp;<small>112 BPM · ◉ ● · · ·</small></div>
      <div class="chip on">● Trackpad</div><div class="chip on">● Dial</div><div class="chip on">🔒 Locked</div>
    </div>
  </div>
  <div class="stage">
    <div class="dialwrap"><img src="file:///C:/Users/brend/Projects/ulanzi-synth/public/ulanzi-dial.png"><span class="dlabel">ULANZI DIAL</span></div>
    <div class="board"><div class="wave" id="wave"></div><div class="hint"><b>Play it.</b> drag the pad · tap a loop to layer · turn the knob to warp</div></div>
    <div class="right">
      <div class="vibes" id="vibes"></div>
      <div class="secthead">Loops — tap to record a layer, tap to mute</div>
      <div class="loops">
        <div class="loop play"><b>1</b><small>playing</small></div><div class="loop rec"><b>2</b><small>● recording</small></div>
        <div class="loop"><b>3</b><small>empty</small></div><div class="loop play"><b>4</b><small>playing</small></div>
        <div class="loop"><b>5</b><small>empty</small></div><div class="loop"><b>6</b><small>empty</small></div>
      </div>
      <div class="secthead">Beat</div>
      <div class="beat" id="beat"></div>
    </div>
  </div>
<script>
  var W=document.getElementById('wave'); for(var i=0;i<70;i++){var b=document.createElement('i');var h=8+Math.abs(Math.sin(i*0.5))*70+Math.random()*18;b.style.height=h+'%';W.appendChild(b);}
  var cols=['#e8503a','#f0a23c','#46a06a','#2f6fb0','#9b59b6','#e84393','#16a085'];var names=['Pretty','Pluck','Bass','Bells','Keys','Lead','Wild'];
  var V=document.getElementById('vibes'); names.forEach(function(n,i){var e=document.createElement('button');e.className='vibe';e.textContent=n;e.style.background=cols[i%cols.length];V.appendChild(e);});
  var B=document.getElementById('beat'); for(var j=0;j<16;j++){var c=document.createElement('i');if(j%4===0)c.className='b';if([0,4,6,10,12].indexOf(j)>=0)c.className='on';B.appendChild(c);}
</script>
</body></html>
