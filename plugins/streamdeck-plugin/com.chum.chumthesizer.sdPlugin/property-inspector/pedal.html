<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chum Pedal</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #ddd;
           background: #2d2d2d; margin: 0; padding: 12px; }
    .row { display: flex; align-items: center; margin-bottom: 10px; }
    .label { width: 90px; opacity: .85; }
    select { flex: 1; background: #3d3d3d; color: #eee; border: 1px solid #555; border-radius: 4px;
             padding: 4px 6px; }
    .hint { font-size: 12px; opacity: .65; line-height: 1.45; }
    b { color: #fff; }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">Pedal</div>
    <select id="pedal">
      <option value="">Auto (by placement order)</option>
      <option value="1">Pedal 1 (left)</option>
      <option value="2">Pedal 2 (middle)</option>
      <option value="3">Pedal 3 (right)</option>
    </select>
  </div>
  <div class="hint">
    Stepping on this pedal fires a pad/trigger in Chumthesizer. Leave on <b>Auto</b> and put the
    action on all three pedals to get pedals 1/2/3 with no setup, or pin a specific one here.
  </div>

  <script>
    let websocket = null;
    let uuid = null;
    let actionInfo = null;

    // Stream Deck calls this global with the PI registration details.
    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      try { actionInfo = JSON.parse(inActionInfo); } catch (e) { actionInfo = {}; }

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);
      websocket.onopen = function () {
        websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
        // Apply any saved setting to the dropdown.
        const settings = (actionInfo && actionInfo.payload && actionInfo.payload.settings) || {};
        if (settings.pedal !== undefined && settings.pedal !== null) {
          document.getElementById("pedal").value = String(settings.pedal);
        }
      };
    }

    function save() {
      const pedal = document.getElementById("pedal").value;
      const settings = { pedal: pedal };
      if (websocket && websocket.readyState === 1) {
        // Persist on the action instance…
        websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
        // …and nudge the plugin so it updates immediately without waiting for a settings echo.
        websocket.send(JSON.stringify({ event: "sendToPlugin", context: uuid,
          action: "com.chum.chumthesizer.pedal", payload: settings }));
      }
    }

    document.getElementById("pedal").addEventListener("change", save);
  </script>
</body>
</html>
